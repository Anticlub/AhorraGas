name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancela ejecuciones antiguas de la misma rama si se empuja algo nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y analizar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar que no se sube google-services.json
        run: |
          if git ls-files | grep -q 'google-services\.json'; then
            echo "::error::Se ha detectado un google-services.json trackeado en el repositorio. Contiene claves de Firebase y NO debe subirse. Quítalo con: git rm --cached <ruta>/google-services.json"
            echo "Archivos detectados:"
            git ls-files | grep 'google-services\.json'
            exit 1
          fi
          echo "OK: ningún google-services.json trackeado en git."

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Generar google-services.json desde el secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Falta el secret GOOGLE_SERVICES_JSON. Añádelo en Settings > Secrets and variables > Actions (contenido del archivo app/google-services.json en base64)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Compilar (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Ejecutar tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Análisis estático (lint)
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Subir informe de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-lint
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
